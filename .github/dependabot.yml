version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    # These packages' major version is the .NET version (10 here): a major is the move to the next .NET,
    # done deliberately with the SDK in global.json, not by Dependabot. ApiDescription.Server 11.0.0 runs a
    # build-time tool that needs the .NET 11 runtime and broke every build (#285).
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.ApiDescription.Server"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql.EntityFrameworkCore.PostgreSQL"
        update-types: ["version-update:semver-major"]
    groups:
      aspire:
        patterns: ["Aspire.*"]
      opentelemetry:
        patterns: ["OpenTelemetry.*", "Azure.Monitor.OpenTelemetry.*"]
      # The build-time OpenAPI generator and ASP.NET Core's OpenAPI package load the same
      # Microsoft.OpenApi, so they move together (listed before microsoft-extensions, which would
      # otherwise take the generator).
      openapi:
        patterns: ["Microsoft.AspNetCore.OpenApi", "Microsoft.Extensions.ApiDescription.Server"]
      microsoft-extensions:
        patterns: ["Microsoft.Extensions.*"]
      # The xunit v3 packages pin each other's versions: they can only move together (see #87).
      xunit:
        patterns: ["xunit.v3.*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly

  # The SPA: version updates once a month in one group (security updates come as they appear).
  - package-ecosystem: npm
    directory: /src/web
    target-branch: dev
    schedule:
      interval: monthly
    # A TypeScript major waits until typescript-eslint supports it (7.0 broke npm ci in #225).
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      web:
        patterns: ["*"]

  # The end-to-end tests (Playwright), run after every staging deploy.
  - package-ecosystem: npm
    directory: /tests/e2e
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      e2e:
        patterns: ["*"]
