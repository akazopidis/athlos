version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      aspire:
        patterns: ["Aspire.*"]
      opentelemetry:
        patterns: ["OpenTelemetry.*", "Azure.Monitor.OpenTelemetry.*"]
      # The build-time OpenAPI generator and ASP.NET Core's OpenAPI package load the same
      # Microsoft.OpenApi, so they move together (listed before microsoft-extensions, which would
      # otherwise take the generator).
      openapi:
        patterns: ["Microsoft.AspNetCore.OpenApi", "Microsoft.Extensions.ApiDescription.Server"]
      microsoft-extensions:
        patterns: ["Microsoft.Extensions.*"]
      # The xunit v3 packages pin each other's versions: they can only move together (see #87).
      xunit:
        patterns: ["xunit.v3.*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly

  # The end-to-end tests (Playwright), run after every staging deploy.
  - package-ecosystem: npm
    directory: /tests/e2e
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      e2e:
        patterns: ["*"]
