# Deploys env.bicep for one environment with a given image tag, then smoke tests it.
# With promote-from, it first copies existing images to the new tag inside the registry
# (az acr import), so nothing is rebuilt (design §12.2).
name: deploy

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      image-tag:
        description: Tag the environment runs
        type: string
        required: true
      promote-from:
        description: Existing tag to copy to image-tag first (empty = images already exist)
        type: string
        default: ""
      app-version:
        description: Version shown on /version (defaults to image-tag)
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: acrathlosshared
  IMAGES: gateway tenancy-api catalog-api ordering-api enrollment-api notifications-worker db-migrator

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.bicep.outputs.gateway-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Promote images
        if: inputs.promote-from != ''
        env:
          FROM: ${{ inputs.promote-from }}
          TO: ${{ inputs.image-tag }}
        run: |
          for image in $IMAGES; do
            az acr import --name "$REGISTRY" --force \
              --source "$REGISTRY.azurecr.io/athlos/$image:$FROM" --image "athlos/$image:$TO"
          done

      # Three steps, so an app never starts against a database that is not ready:
      # 1. env.bicep without the apps (identities, Key Vault, App Insights, the migrator job);
      # 2. run the migrator job and wait for it;
      # 3. env.bicep with the apps.
      - name: Deploy env.bicep
        id: bicep
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_TAG: ${{ inputs.image-tag }}
          APP_VERSION: ${{ inputs.app-version || inputs.image-tag }}
          AUTH_AUTHORITY: ${{ vars.AUTH_AUTHORITY }}
          AUTH_AUDIENCE: ${{ vars.AUTH_AUDIENCE }}
          SPA_CLIENT_ID: ${{ vars.SPA_CLIENT_ID }}
          API_SCOPE: ${{ vars.API_SCOPE }}
          STRIPE_CONFIGURED: ${{ vars.STRIPE_CONFIGURED || 'false' }}
          # Prod environment variable: who gets the gateway 5xx alert (design §6). Empty: no alert.
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        run: |
          # Gateway signing key: reuse the stored one; only the first deploy (no vault yet) creates it.
          # If the vault exists but the key cannot be read, fail rather than silently rotate it.
          vault="kv-athlos-$ENVIRONMENT"
          if az keyvault show --name "$vault" --output none 2>/dev/null; then
            GATEWAY_SIGNING_KEY=$(az keyvault secret show --vault-name "$vault" --name gateway-signing-key --query value --output tsv)
          else
            GATEWAY_SIGNING_KEY=$(openssl rand -base64 48)
          fi
          echo "::add-mask::$GATEWAY_SIGNING_KEY"
          export GATEWAY_SIGNING_KEY

          deploy() {
            DEPLOY_APPS=$1 az deployment group create \
              --resource-group "rg-athlos-$ENVIRONMENT" \
              --name "env-${{ github.run_id }}-$2" \
              --parameters "infra/$ENVIRONMENT.bicepparam" \
              --query properties.outputs --output json
          }

          echo "::group::Supporting resources and migrator job"
          deploy false base > /dev/null
          echo "::endgroup::"

          echo "::group::Database migrations"
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          job="caj-athlos-migrator-$ENVIRONMENT"
          execution=$(az containerapp job start --name "$job" --resource-group "rg-athlos-$ENVIRONMENT" --query name --output tsv)
          for attempt in $(seq 1 60); do
            status=$(az containerapp job execution show --name "$job" --resource-group "rg-athlos-$ENVIRONMENT" \
              --job-execution-name "$execution" --query properties.status --output tsv)
            echo "migrator: $status"
            [[ "$status" == "Succeeded" ]] && break
            [[ "$status" == "Failed" ]] && { echo "::error::Migrator job $execution failed; see its logs in App Insights (cloud_RoleName db-migrator)"; exit 1; }
            sleep 10
          done
          [[ "$status" == "Succeeded" ]] || { echo "::error::Migrator job $execution did not finish in time"; exit 1; }
          echo "::endgroup::"

          outputs=$(deploy true apps)
          echo "gateway-url=$(jq -r .gatewayUrl.value <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "tenancy-api-fqdn=$(jq -r .tenancyApiFqdn.value <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "catalog-api-fqdn=$(jq -r .catalogApiFqdn.value <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "ordering-api-fqdn=$(jq -r .orderingApiFqdn.value <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "enrollment-api-fqdn=$(jq -r .enrollmentApiFqdn.value <<< "$outputs")" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        env:
          URL: ${{ steps.bicep.outputs.gateway-url }}
          TENANCY_API: ${{ steps.bicep.outputs.tenancy-api-fqdn }}
          CATALOG_API: ${{ steps.bicep.outputs.catalog-api-fqdn }}
          ORDERING_API: ${{ steps.bicep.outputs.ordering-api-fqdn }}
          ENROLLMENT_API: ${{ steps.bicep.outputs.enrollment-api-fqdn }}
          EXPECTED_VERSION: ${{ inputs.app-version || inputs.image-tag }}
        run: |
          # The old revision keeps serving until the new one is ready, and apps may be cold-starting
          # from zero, so wait until /version reports the version just deployed.
          version=""
          for attempt in $(seq 1 30); do
            version=$(curl --fail --silent "$URL/version" | jq -r .version || true)
            [[ "$version" == "$EXPECTED_VERSION" ]] && break
            echo "serving '$version', waiting for '$EXPECTED_VERSION' ($attempt)"; sleep 10
          done
          [[ "$version" == "$EXPECTED_VERSION" ]] || { echo "::error::/version is '$version', expected '$EXPECTED_VERSION'"; exit 1; }
          curl --fail --silent --show-error "$URL/health/ready"
          # Through the gateway the request is signed; tenancy-api accepts it.
          curl --fail --silent --show-error "$URL/api/v1/plans" | jq -e 'length > 0'
          curl --fail --silent --show-error "$URL/" | grep -q '<div id="root">'
          curl --fail --silent --show-error "$URL/api/v1/marketplace/programs" | jq -e '.totalCount >= 0'
          # Isolation layer 1: calling a service directly, around the gateway, must not work.
          for target in "tenancy-api https://$TENANCY_API/api/v1/plans" "catalog-api https://$CATALOG_API/api/v1/marketplace/programs" "ordering-api https://$ORDERING_API/api/v1/me/orders" "enrollment-api https://$ENROLLMENT_API/api/v1/me/programs"; do
            read -r name address <<< "$target"
            direct=$(curl --silent --max-time 10 --output /dev/null --write-out '%{http_code}' "$address" || true)
            [[ "$direct" != 2* ]] || { echo "::error::$name answered $direct when called directly"; exit 1; }
            echo "Direct call to $name: $direct (000 = unreachable, 401 = unsigned request rejected)"
          done
          echo "### $URL is running $version" >> "$GITHUB_STEP_SUMMARY"
