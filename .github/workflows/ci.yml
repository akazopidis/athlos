name: ci

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # main only receives PRs from dev or hotfix/* (design §12.1). Skipped on PRs into dev, which counts as passing.
  source-branch:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" != "dev" && "$HEAD_REF" != hotfix/* ]]; then
            echo "::error::PRs into main must come from dev or hotfix/*, not '$HEAD_REF'."
            exit 1
          fi

  # Branch protection requires these jobs by name: backend, frontend, infra (and source-branch on main).
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - run: dotnet restore Athlos.slnx
      - run: dotnet build Athlos.slnx --no-restore --configuration Release

      # Contract check (design §15.1): the build rewrites each service's OpenAPI document, so a
      # changed endpoint whose checked-in document was not updated shows up as a diff.
      - name: OpenAPI documents match the code
        run: |
          if ! git diff --exit-code --stat -- 'src/Services/*/openapi/'; then
            echo "::error::An OpenAPI document is out of date. Build locally and commit src/Services/*/openapi/, then run npm run generate:api in src/web."
            exit 1
          fi
      - run: dotnet test Athlos.slnx --no-build --configuration Release

      # The deploy publishes these as container images; catch publish-only errors (such as
      # duplicate output files) before merging, not in deploy-dev.
      - name: Publish deployables
        run: |
          for project in src/Gateway src/Services/Athlos.Tenancy.Api src/Services/Athlos.Catalog.Api src/Services/Athlos.Ordering.Api src/Services/Athlos.Enrollment.Api src/Workers/Athlos.Notifications.Worker src/Tools/Athlos.DbMigrator; do
            dotnet publish "$project" --no-build --configuration Release --output "$RUNNER_TEMP/publish/$(basename "$project")"
          done

  # Old code on a new schema (design §12.2, backlog item 41): the latest release's backend tests run
  # against this code's schema, as the released apps do while a deploy rolls out or after a rollback.
  # This code's db-migrator prepares each test database first (ATHLOS_TEST_NEWER_MIGRATOR, read by
  # tests/Athlos.Testing/AthlosDatabases.cs), then the release's own tests run unchanged. On release PRs
  # into main, and by hand. A release from before the seam existed is skipped with a notice.
  previous-release:
    if: github.base_ref == 'main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Latest release and this code's db-migrator
        id: previous
        run: |
          tag=$(git tag --list 'v*' --sort=-v:refname | head -1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git worktree add "$RUNNER_TEMP/previous" "$tag"
          if grep -q ATHLOS_TEST_NEWER_MIGRATOR "$RUNNER_TEMP/previous/tests/Athlos.Testing/AthlosDatabases.cs"; then
            echo "seam=true" >> "$GITHUB_OUTPUT"
            dotnet build src/Tools/Athlos.DbMigrator --configuration Release --output "$RUNNER_TEMP/migrator"
          else
            echo "::notice::$tag's tests cannot take a newer schema yet (no ATHLOS_TEST_NEWER_MIGRATOR); skipped."
          fi

      - name: The release's tests on this schema
        if: steps.previous.outputs.seam == 'true'
        working-directory: ${{ runner.temp }}/previous
        env:
          ATHLOS_TEST_NEWER_MIGRATOR: ${{ runner.temp }}/migrator/Athlos.DbMigrator.dll
        run: dotnet test Athlos.slnx --configuration Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - run: npm ci

      # The typed client must be generated from the checked-in OpenAPI documents (design §8, §15.1).
      - name: API client matches the OpenAPI documents
        run: |
          npm run generate:api
          if ! git diff --exit-code --stat -- src/api; then
            echo "::error::src/web/src/api is out of date. Run npm run generate:api in src/web and commit it."
            exit 1
          fi

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The end-to-end tests run against staging after a deploy (deploy-staging.yml); here they are
      # only type-checked, so a broken spec is caught in the PR.
      - name: Type-check the end-to-end tests
        working-directory: tests/e2e
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm ci
          npx tsc -p .

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Bicep
        run: |
          for file in infra/*.bicep infra/modules/*.bicep; do
            az bicep lint --file "$file"
          done

      - name: Build parameter files
        env:
          IMAGE_TAG: sha-ci
          GATEWAY_SIGNING_KEY: not-a-real-key
        run: |
          for env in dev staging prod; do
            az bicep build-params --file "infra/$env.bicepparam" --stdout > /dev/null
          done

  # What a PR's infra/ change would do (design §11): Azure's what-if for dev, signed in with dev's
  # identity, posted to the job summary. Only on PRs that touch infra/; not a required check, so an
  # Azure hiccup never blocks a merge. Dev's current images are kept, so only infra changes show.
  infra-what-if:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: changed
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          if git diff --quiet "$BASE...HEAD" -- infra/; then
            echo "infra=false" >> "$GITHUB_OUTPUT"
            echo "No change under infra/: nothing to preview."
          else
            echo "infra=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changed.outputs.infra == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: What-if for dev
        if: steps.changed.outputs.infra == 'true'
        env:
          AUTH_AUTHORITY: ${{ vars.AUTH_AUTHORITY }}
          AUTH_AUDIENCE: ${{ vars.AUTH_AUDIENCE }}
          SPA_CLIENT_ID: ${{ vars.SPA_CLIENT_ID }}
          API_SCOPE: ${{ vars.API_SCOPE }}
          STRIPE_CONFIGURED: ${{ vars.STRIPE_CONFIGURED || 'false' }}
          ACCOUNT_DELETION_CLIENT_ID: ${{ vars.ACCOUNT_DELETION_CLIENT_ID }}
        run: |
          GATEWAY_SIGNING_KEY=$(az keyvault secret show --vault-name kv-athlos-dev --name gateway-signing-key --query value --output tsv)
          echo "::add-mask::$GATEWAY_SIGNING_KEY"
          export GATEWAY_SIGNING_KEY
          SIGNING_KEY_ROTATING=false
          if az keyvault secret show --vault-name kv-athlos-dev --name gateway-signing-key-also --output none 2>/dev/null; then
            SIGNING_KEY_ROTATING=true
          fi
          export SIGNING_KEY_ROTATING
          image=$(az containerapp show -g rg-athlos-dev -n ca-athlos-gateway-dev --query "properties.template.containers[0].image" --output tsv)
          export IMAGE_TAG="${image##*:}"
          export APP_VERSION="$IMAGE_TAG"
          az deployment group what-if --resource-group rg-athlos-dev --parameters infra/dev.bicepparam --no-pretty-print --output json > whatif.json
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json, os, sys
          changes = json.load(open("whatif.json"))["changes"]
          name = lambda c: c["resourceId"].split("/providers/")[-1]
          def paths(delta, prefix=""):
              for d in delta or []:
                  path = f"{prefix}.{d['path']}" if prefix else d["path"]
                  if d.get("children"):
                      yield from paths(d["children"], path)
                  else:
                      yield f"{d['propertyChangeType']} {path}"
          def count(delta):
              return len(list(paths(delta)))
          for c in changes:
              if c["changeType"] == "Modify":
                  print(name(c), *paths(c.get("delta")), sep="\n    ", file=sys.stderr)
          print(f"### What-if for dev (`env.bicep`, images `{os.environ['IMAGE_TAG']}`)")
          print("Create and Delete are real. Modify also lists what-if noise: values built from references (Key Vault URLs, environment values) and server defaults Bicep does not set; open the log for the property paths.")
          print("| Change | Resource | Properties |")
          print("|---|---|---|")
          for c in changes:
              if c["changeType"] in ("Create", "Delete", "Modify"):
                  print(f"| {c['changeType']} | `{name(c)}` | {count(c.get('delta')) if c['changeType'] == 'Modify' else ''} |")
          EOF
