# Every push to dev: build images tagged sha-<short>, deploy them to dev (design §12.3).
name: deploy-dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  # Registry and Log Analytics must exist before images are pushed. Only dev deploys shared.bicep.
  shared:
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      image-tag: ${{ steps.tag.outputs.image-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: tag
        run: echo "image-tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - run: >
          az deployment group create --resource-group rg-athlos-shared
          --name "shared-${{ github.run_id }}" --template-file infra/shared.bicep --output none

  build:
    needs: shared
    uses: ./.github/workflows/_build.yml
    with:
      environment: dev
      image-tag: ${{ needs.shared.outputs.image-tag }}

  deploy:
    needs: [shared, build]
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: dev
      image-tag: ${{ needs.shared.outputs.image-tag }}
