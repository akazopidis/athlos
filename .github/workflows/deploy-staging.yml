# Every merge into main: deploy the images dev already built for the merged commit (design §12.3).
# The images get an extra tag sha-<main commit>, so a release tag on that commit finds them.
name: deploy-staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  REGISTRY: acrathlosshared

jobs:
  resolve:
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      image-tag: ${{ steps.find.outputs.image-tag }}
      promote-from: ${{ steps.find.outputs.promote-from }}
      needs-build: ${{ steps.find.outputs.needs-build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # A merge from dev has the dev commit as its second parent; dev built images for it.
      # A hotfix (or anything without dev images) is built here instead.
      - id: find
        run: |
          main_tag="sha-${GITHUB_SHA::7}"
          echo "image-tag=$main_tag" >> "$GITHUB_OUTPUT"
          source=$(git rev-parse --verify --quiet HEAD^2 || true)
          if [[ -n "$source" ]] && az acr manifest show --registry "$REGISTRY" --name "athlos/gateway:sha-${source::7}" --output none 2>/dev/null; then
            echo "Promoting images sha-${source::7} built on dev"
            echo "promote-from=sha-${source::7}" >> "$GITHUB_OUTPUT"
            echo "needs-build=false" >> "$GITHUB_OUTPUT"
          else
            echo "No dev images for this commit; building $main_tag"
            echo "needs-build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.needs-build == 'true'
    uses: ./.github/workflows/_build.yml
    with:
      environment: staging
      image-tag: ${{ needs.resolve.outputs.image-tag }}

  deploy:
    needs: [resolve, build]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.build.result != 'failure' }}
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: staging
      image-tag: ${{ needs.resolve.outputs.image-tag }}
      promote-from: ${{ needs.resolve.outputs.promote-from }}

  # End-to-end tests against the deployed staging (design §15.1): the shop at phone, tablet and
  # desktop sizes, and, once the test customer's secrets exist, sign-in and checkout up to Stripe.
  # The report, with a screenshot of every main page at every size, is kept as an artifact.
  e2e:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_PROGRAM_PATH: ${{ vars.E2E_PROGRAM_PATH }}
        run: npx playwright test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: e2e-report
          path: tests/e2e/playwright-report
          retention-days: 14
