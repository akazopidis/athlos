# A monthly reminder (infra/README.md, "Rotating secrets"): fails, so GitHub emails the owner, when a
# secret in dev's Key Vault expires within 60 days. Scheduled runs use the default branch (dev),
# which only the dev environment allows, and dev's identity can read only dev's vault. The setup
# scripts store each secret in all three stages in one run, with the same expiry, so dev's dates
# stand for staging's and prod's.
name: secret-expiry

on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Secrets that expire within 60 days
        run: |
          limit=$(date -u -d '+60 days' +%Y-%m-%dT%H:%M:%SZ)
          soon=$(az keyvault secret list --vault-name kv-athlos-dev \
            --query "[?attributes.expires != null && attributes.expires < '$limit'].[name, attributes.expires]" --output tsv)
          if [ -n "$soon" ]; then
            echo "::error::Secrets expire before $limit; rotate them in every stage (infra/README.md):"
            echo "$soon"
            exit 1
          fi
          echo "No secret in kv-athlos-dev expires before $limit."
