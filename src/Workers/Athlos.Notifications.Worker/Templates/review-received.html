<!doctype html>
<html lang="en">
<body style="font-family: system-ui, sans-serif; color: #1a1a1a; max-width: 32rem;">
  <h1 style="font-size: 1.25rem;">New review of {{programTitle}}</h1>
  <p style="font-size: 1.25rem; color: #b45309;" aria-label="{{rating}} out of 5">{{stars}}</p>
  <blockquote style="margin: 0; padding-left: 1rem; border-left: 3px solid #ddd; color: #444;">{{comment}}</blockquote>
  <p><a href="{{reviewsUrl}}">Read it and reply in your studio</a></p>
  <p style="color: #666; font-size: 0.875rem;">Athlos</p>
</body>
</html>
