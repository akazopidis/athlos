<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Training programs from independent coaches. Buy once, train at your own pace." />
    <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0f14" media="(prefers-color-scheme: dark)" />
    <title>Athlos</title>
    <!-- main.tsx waits for it before the first render; fetched alongside the JavaScript instead of after it. -->
    <link rel="preload" href="/config.json" as="fetch" crossorigin />
    <!-- Font preloads are added by vite.config.ts (the file names carry a hash). -->
  </head>
  <body>
    <!--
      A static shell (backlog item 56): the header as the app draws it, painted as soon as the HTML and the
      stylesheet are in, instead of after the JavaScript has loaded, read /config.json and rendered.
      React replaces it on its first render (createRoot), so it holds nothing interactive.
    -->
    <div id="root">
      <header class="sticky top-0 z-40 border-b bg-background/90" aria-hidden="true">
        <div class="container-page flex h-16 items-center gap-3 sm:gap-6">
          <span class="flex items-center gap-2">
            <svg viewBox="0 0 32 32" class="size-8 shrink-0">
              <rect width="32" height="32" rx="9" fill="var(--volt)" />
              <path d="M7.5 22.5 14 10l4 7.5 2.5-4 4 9" fill="none" stroke="var(--volt-foreground)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span class="font-heading text-xl font-extrabold tracking-tight" style="font-stretch: 85%">ATHLOS</span>
          </span>
          <span class="hidden h-10 flex-1 rounded-full bg-muted/60 md:block"></span>
        </div>
        <div class="container-page pb-3 md:hidden"><span class="block h-10 rounded-full bg-muted/60"></span></div>
        <div class="hidden border-t md:block"><div class="h-11"></div></div>
      </header>
      <main class="min-h-dvh"></main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
